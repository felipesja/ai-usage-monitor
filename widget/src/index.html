<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Usage Widget</title>
  <style>
    :root {
      --bg: rgba(27, 29, 30, 0.93);
      --cyan: #5fd7d7;
      --claude: #d7875f;
      --openai: #00af87;
      --cursor: #d0d0d0;
      --amber: #ffaf00;
      --green: #5fd787;
      --red: #ff5f5f;
      --muted: #8a8a8a;
      --dim: #585858;
      --text: #eeeeee;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; width: 0; height: 0; }
    html, body { height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: "JetBrainsMono Nerd Font", "JetBrains Mono", Consolas, monospace;
      font-size: 12.5px;
      color: var(--text);
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 14px;
      overflow: hidden;
      user-select: none;
      cursor: default;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding-bottom: 2px;
    }
    header .brand { color: var(--cyan); font-weight: 700; }
    header .status { margin-left: auto; color: var(--green); font-size: 11px; display: flex; align-items: center; gap: 4px; }
    header .status.fetching { color: var(--amber); }
    @keyframes spin { to { transform: rotate(360deg); } }
    header .status.fetching .icon { display: inline-block; animation: spin 1s linear infinite; }
    .subtitle-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .subtitle { color: var(--muted); font-size: 11px; }
    /* Right-aligned so it sits directly under the header's timestamp. */
    .autorefresh { margin-left: auto; color: var(--muted); font-size: 10.5px; }
    main { flex: 1; overflow-y: auto; scrollbar-width: none; }
    .provider { margin-bottom: 18px; }
    .provider-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .identity { flex: 1; min-width: 0; }
    .name-row { display: flex; align-items: baseline; gap: 8px; }
    .provider-name { font-weight: 700; }
    .provider-name.Claude { color: var(--claude); }
    .provider-name.Codex { color: var(--openai); }
    .provider-name.Cursor { color: var(--cursor); }
    .plan { margin-left: auto; color: var(--muted); font-size: 10.5px; }
    .badge { font-size: 10px; font-weight: 700; white-space: nowrap; }
    .badge.standby { color: var(--cyan); }
    .email { color: var(--muted); font-size: 10.5px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .error { color: var(--red); font-size: 11px; }
    .detail { color: var(--muted); font-size: 10.5px; padding-left: 10px; margin-top: 2px; }
    .detail.warn { color: var(--amber); }
    .meter { display: grid; grid-template-columns: 1fr auto auto; gap: 3px 8px; align-items: center; padding: 1px 0 1px 10px; }
    .meter + .meter { margin-top: 6px; }
    .meter .label { color: var(--text); font-size: 12px; white-space: nowrap; overflow: hidden; }
    .meter .bar { grid-column: 1 / -1; height: 7px; background: rgba(255, 255, 255, 0.09); border-radius: 3px; overflow: hidden; margin-top: 1px; }
    .meter .bar > div { height: 100%; border-radius: 3px; }
    .meter .pct { font-weight: 700; font-size: 12px; text-align: right; min-width: 4ch; }
    .meter .reset { color: var(--muted); font-size: 11px; text-align: right; min-width: 8ch; }
    .meter.idle .label, .meter.idle .pct, .meter.idle .reset { color: var(--dim); }
    .meter.idle .pct { font-weight: 400; }
    footer { color: var(--muted); font-size: 10.5px; padding-top: 4px; display: flex; align-items: center; }
    footer .buttons { margin-left: auto; display: flex; gap: 10px; }
    footer .btn { color: var(--dim); cursor: pointer; font-size: 13px; }
    footer .btn:hover { color: var(--text); }
    footer .btn.close:hover { color: var(--red); }

    /* Accounts view (⚙): swapped in place of the provider list. */
    #accounts { flex: 1; overflow-y: auto; display: none; }
    body.show-accounts main#providers { display: none; }
    body.show-accounts #accounts { display: block; }
    .acct-section { margin-bottom: 16px; }
    .acct-title { color: var(--cyan); font-weight: 700; margin-bottom: 4px; }
    .acct-row { display: flex; gap: 8px; align-items: baseline; padding: 2px 0 2px 10px; }
    .acct-row .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .acct-row .meta { color: var(--muted); font-size: 10.5px; white-space: nowrap; }
    .acct-act { cursor: pointer; white-space: nowrap; }
    .acct-act.add { color: var(--green); }
    .acct-act.add:hover { color: var(--text); }
    .acct-act.rm { color: var(--dim); }
    .acct-act.rm:hover { color: var(--red); }
    .acct-act.disabled { color: var(--dim); pointer-events: none; }
    .acct-hint { color: var(--muted); font-size: 10.5px; padding-left: 10px; }
    .acct-msg { font-size: 10.5px; margin: 4px 0 0 10px; min-height: 14px; color: var(--muted); }
    .acct-msg.err { color: var(--red); }
    .acct-msg.ok { color: var(--green); }
    .acct-form { display: flex; flex-direction: column; gap: 6px; padding: 4px 0 0 10px; }
    .acct-form label { color: var(--muted); font-size: 10.5px; display: flex; gap: 6px; align-items: center; }
    .acct-input, .acct-select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      font: inherit;
      font-size: 11px;
      border-radius: 4px;
      padding: 3px 6px;
      flex: 1;
      min-width: 0;
    }
    .acct-select option { background: #1b1d1e; }
    .acct-save { color: var(--cyan); cursor: pointer; align-self: flex-start; }
    .acct-save:hover { color: var(--text); }
  </style>
</head>
<body data-tauri-drag-region>
  <header data-tauri-drag-region>
    <span class="brand">◆ AI USAGE</span>
    <span class="status" id="status"><span class="icon">○</span><span class="text">loading</span></span>
  </header>
  <div class="subtitle-row">
    <span class="subtitle" id="subtitle"></span>
    <span class="autorefresh" id="autorefresh">auto-refresh every 60s</span>
  </div>
  <main id="providers" data-tauri-drag-region></main>
  <section id="accounts"></section>
  <footer>
    <span id="foothint">r refresh · a accounts · esc hide</span>
    <span class="buttons">
      <span class="btn" id="settings" title="accounts">⚙</span>
      <span class="btn" id="refresh" title="refresh">↻</span>
      <span class="btn close" id="close" title="hide to tray">✕</span>
    </span>
  </footer>
  <script src="main.js"></script>
</body>
</html>
