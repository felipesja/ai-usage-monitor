[package]
name = "ai-usage-widget"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api backs the transparent window (macOSPrivateApi in
# tauri.conf.json); it is a no-op on the other platforms, but has to be
# declared here because tauri-build validates the config against this table.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# PNG decoding for the template tray icon and sha2 for mapping Keychain entry
# hashes back to config dirs, macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
sha2 = "0.10"

[profile.release]
strip = true
lto = true
